name: Docker image

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a semantic version tag"
            exit 1
          fi

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\r\n' < VERSION)"
          if [[ "${tag_version}" != "${file_version}" ]]; then
            echo "Tag version ${tag_version} does not match VERSION ${file_version}"
            exit 1
          fi

  gate:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, gate]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test release image
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          release_image="$(printf '%s\n' "${RELEASE_TAGS}" | head -n 1)"
          container_name="vault-release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "${container_name}" \
            --publish 127.0.0.1:18000:8000 \
            --env VAULT_DEV_MODE=1 \
            --env VAULT_AUTH_MODE=dev \
            --env VAULT_DEV_AUTH=1 \
            --env VAULT_SESSION_SECRET=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 \
            "${release_image}"

          ready=0
          for _ in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "${ready}" -ne 1 ]]; then
            docker logs "${container_name}"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18000/api/bootstrap \
            | jq --exit-status --arg version "$(tr -d '\r\n' < VERSION)" '.version == $version'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              docker push "${tag}"
            fi
          done <<< "${RELEASE_TAGS}"
