name: Repository gate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repository-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vault/client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.95 --profile minimal --component clippy,rustfmt
          rustup default 1.95

      - name: Install frontend dependencies
        run: npm --prefix vault/client ci

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0

      - name: Run repository gate
        run: pre-commit run --all-files --config .pre-commit-config.yaml
